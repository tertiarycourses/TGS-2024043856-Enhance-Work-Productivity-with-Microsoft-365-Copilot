name: Deploy verified Copilot lab prompts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tgs-copilot-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1c0d2cc3a73c221c7b1d862b483a1b950aa3cab7
      - uses: actions/configure-pages@v5
      - name: Prepare verified learner site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R prompts labs courseware _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
